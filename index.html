<!DOCTYPE html>
<html lang="pt-PT" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonicly — Música independente</title>
  <meta name="description" content="Sonicly: plataforma para artistas independentes publicarem música e receberem feedback de ouvintes reais.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <!-- UIkit (framework de interface) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uikit@3.21.6/dist/css/uikit.min.css">
  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
  <!-- Estilos do Sonicly -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-mode">

  <div class="app">
    <!-- Barra lateral (computador) -->
    <aside class="sidebar">
      <a href="#/inicio" class="brand">
        <img src="assets/logo.svg" alt="" width="32" height="32">
        <span>Sonicly</span>
      </a>
      <nav class="side-nav">
        <a href="#/inicio" data-route="inicio"><span uk-icon="home"></span> Início</a>
        <a href="#/biblioteca" data-route="biblioteca"><span uk-icon="album"></span> Biblioteca</a>
        <a href="#/perfil" data-route="perfil"><span uk-icon="user"></span> Perfil</a>
        <a href="#/definicoes" data-route="definicoes"><span uk-icon="cog"></span> Definições</a>
        <a href="#/admin" data-route="admin" class="admin-link" hidden><span uk-icon="lock"></span> Administração</a>
      </nav>
      <button class="btn btn-accent btn-block" data-action="open-publish">
        <span uk-icon="plus"></span> Publicar música
      </button>
      <div class="side-user" id="side-user"></div>
    </aside>

    <!-- Conteúdo da página atual -->
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <!-- Navegação inferior (telemóvel) -->
  <nav class="bottom-nav">
    <a href="#/inicio" data-route="inicio"><span uk-icon="home"></span><small>Início</small></a>
    <a href="#/biblioteca" data-route="biblioteca"><span uk-icon="album"></span><small>Biblioteca</small></a>
    <button data-action="open-publish" class="bn-publish" aria-label="Publicar música"><span uk-icon="plus"></span></button>
    <a href="#/perfil" data-route="perfil"><span uk-icon="user"></span><small>Perfil</small></a>
    <a href="#/definicoes" data-route="definicoes"><span uk-icon="cog"></span><small>Definições</small></a>
  </nav>

  <!-- Leitor de áudio fixo (fica a tocar entre páginas) -->
  <footer class="player" id="player">
    <div class="player-track">
      <div class="cover cover-sm" id="pl-cover"></div>
      <div class="player-meta">
        <strong id="pl-title">Nada a tocar</strong>
        <a id="pl-artist" class="muted" href="#/inicio">Escolhe uma música no feed</a>
      </div>
      <button class="icon-btn" id="pl-fav" aria-label="Adicionar aos favoritos" title="Favorito"><span uk-icon="heart"></span></button>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="icon-btn" id="pl-shuffle" aria-label="Aleatório" title="Aleatório"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 6h3.5c2 0 3 1 4.5 4s2.5 4 4.5 4H17"/><path d="M2 14h3.5c1.4 0 2.3-.5 3.2-1.6M11.3 7.6C12.2 6.5 13.1 6 14.5 6H17"/><path d="M15 4l2 2-2 2M15 12l2 2-2 2"/></svg></button>
        <button class="icon-btn" id="pl-prev" aria-label="Anterior"><span uk-icon="chevron-double-left"></span></button>
        <button class="play-btn" id="pl-play" aria-label="Tocar"><span uk-icon="icon: play; ratio: 1.3"></span></button>
        <button class="icon-btn" id="pl-next" aria-label="Seguinte"><span uk-icon="chevron-double-right"></span></button>
        <button class="icon-btn" id="pl-repeat" aria-label="Repetir" title="Repetir"><span uk-icon="refresh"></span></button>
      </div>
      <div class="player-progress">
        <span id="pl-time">0:00</span>
        <input type="range" id="pl-seek" min="0" max="1000" value="0" aria-label="Posição da música">
        <span id="pl-dur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <canvas id="pl-viz" width="120" height="32" aria-hidden="true"></canvas>
      <span uk-icon="icon: volume"></span>
      <input type="range" id="pl-vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <!-- Janela: publicar música -->
  <div id="publish-modal" uk-modal>
    <div class="uk-modal-dialog uk-modal-body modal-card">
      <button class="uk-modal-close-default" type="button" uk-close></button>
      <h2 class="modal-title" id="publish-heading">Publicar música</h2>
      <form id="publish-form" class="form-stack" novalidate>
        <input type="hidden" name="draftId">
        <label>Título
          <input class="uk-input" name="title" maxlength="60" required placeholder="Nome da música">
        </label>
        <label>Género
          <select class="uk-select" name="genre" required></select>
        </label>
        <label>Descrição
          <textarea class="uk-textarea" name="desc" rows="3" maxlength="280" placeholder="Conta a história desta música..."></textarea>
        </label>
        <label>Ficheiro de áudio <small class="muted">(MP3, WAV, OGG — opcional)</small>
          <input class="uk-input" type="file" name="audio" accept="audio/*">
        </label>
        <p class="hint muted">Sem ficheiro? O Sonicly gera uma faixa de demonstração no estilo do género escolhido.</p>
        <p class="form-error" id="publish-error" role="alert"></p>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-action="save-draft">Guardar rascunho</button>
          <button type="submit" class="btn btn-accent">Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Janela: adicionar a playlist -->
  <div id="playlist-modal" uk-modal>
    <div class="uk-modal-dialog uk-modal-body modal-card">
      <button class="uk-modal-close-default" type="button" uk-close></button>
      <h2 class="modal-title">Adicionar a playlist</h2>
      <div id="playlist-choices" class="playlist-choices"></div>
      <form id="new-playlist-form" class="inline-form">
        <input class="uk-input" name="name" maxlength="40" placeholder="Nova playlist" required>
        <button class="btn btn-accent" type="submit">Criar</button>
      </form>
    </div>
  </div>

  <!-- Janela: editar utilizador (administração) -->
  <div id="admin-modal" uk-modal>
    <div class="uk-modal-dialog uk-modal-body modal-card">
      <button class="uk-modal-close-default" type="button" uk-close></button>
      <div id="admin-modal-body"></div>
    </div>
  </div>

  <!-- Scripts: UIkit + código do Sonicly -->
  <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.6/dist/js/uikit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/uikit@3.21.6/dist/js/uikit-icons.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/player.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
